name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**/*.py"
      - "docs/**/*.qmd"
      - "docs/**/*.md"
      - "docs/**/*.yml"
      - "docs/**/*.txt"
      - "docs/**/*.svg"
      - "docs/**/*.bib"
      - "docs/**/*.csl"
      - "docs/**/*.c2pa_manifest.json"
      - ".github/workflows/deploy-docs-ghpage.yml"
      - "tools/docs-orchestrator/**"
      - "!docs/**/README.md"
  workflow_dispatch:
  repository_dispatch:
    types: [publish-sdb-image-complete]
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**/*.py"
      - "docs/**/*.qmd"
      - "docs/**/*.md"
      - "docs/**/*.yml"
      - "docs/**/*.txt"
      - "docs/**/*.svg"
      - "docs/**/*.bib"
      - "docs/**/*.csl"
      - "docs/**/*.c2pa_manifest.json"
      - "tools/docs-orchestrator/**"
      - ".github/workflows/deploy-docs-ghpage.yml"
      - "!docs/**/README.md"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sdbs

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull or build Docker image
        run: |
          if docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest 2>/dev/null; then
            echo "Image pulled successfully."
          else
            echo "Image not found in registry. Building from tools/docs-orchestrator/Dockerfile..."
            docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -f tools/docs-orchestrator/Dockerfile .
          fi
        shell: bash

      - name: Run documentation build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            -e QUARTO_PYTHON=python3 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            sdb build docs --website

      - name: Prepare Pages artifact
        run: |
          mkdir -p docs/_pages
          cp -r docs/_site/. docs/_pages/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_pages

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Prepare agent artifact
        run: |
          mkdir -p _agent/docs
          cp -r docs/_llms _agent/docs/

      - name: Upload agent artifacts to R2-S3
        if: ${{ github.ref == 'refs/heads/main' && github.actor != 'nektos/act' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CFR2_USR_API_S3_ACCID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CFR2_USR_API_S3_SECKEY }}
        run: |
          aws s3 sync _agent/docs s3://ssccs-nexus-af/ssccs/docs \
            --endpoint-url ${{ secrets.CFR2_USR_API_HOST }} \
            --delete
        shell: bash

      - name: Trigger Nexus Build
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SSCCS_NEXUS_ACTIONS_READWRITE_PAT }}
          repository: ssccsorg/ssccs-nexus
          event-type: ssccs-docs-agent-af
