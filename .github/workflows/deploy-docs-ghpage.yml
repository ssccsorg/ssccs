name: Deploy Docs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**/*.py'
      - 'docs/**/*.qmd'
      - 'docs/**/*.md'
      - 'docs/**/*.yml'
      - 'docs/**/*.txt'
      - 'docs/**/*.svg'
      - 'docs/**/*.bib'
      - 'docs/**/*.csl'
      - 'docs/**/*.c2pa_manifest.json'
      - '.github/workflows/deploy-docs-ghpage.yml'
      - '!docs/**/README.md'
  workflow_dispatch:
  repository_dispatch:
    types: [publish-docs-image-complete]
  pull_request:
    branches: ["main"]
    paths:
      - 'docs/**/*.py'
      - 'docs/**/*.qmd'
      - 'docs/**/*.md'
      - 'docs/**/*.yml'
      - 'docs/**/*.txt'
      - 'docs/**/*.svg'
      - 'docs/**/*.bib'
      - 'docs/**/*.csl'
      - 'docs/**/*.c2pa_manifest.json'
      - '.github/workflows/deploy-docs-ghpage.yml'
      - '!docs/**/README.md'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute cache key
        id: cache-key
        run: |
          cd ${{ github.workspace }}
          find docs -type f \( -name "*.qmd" -o -name "*.md" -o -name "*.py" -o -name "*.txt" -o -name "*.yml" -o -name "*.svg" -o -name "*.bib" -o -name "*.csl" -o -name "*.c2pa_manifest.json" \) -not -path "*/_cached/*" -not -path "*/_site/*" | sort | xargs sha256sum | sha256sum | cut -d' ' -f1 > /tmp/cache_key.txt
          echo "key=$(cat /tmp/cache_key.txt)" >> $GITHUB_OUTPUT

      - name: Cache _cached directory
        uses: actions/cache@v5
        with:
          path: _cached
          key: ${{ runner.os }}-cached-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-cached-

      - name: Cache _jupyter_cache directory
        uses: actions/cache@v5
        with:
          path: _jupyter_cache
          key: ${{ runner.os }}-jupyter-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-jupyter-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built Docker image
        run: docker pull ghcr.io/${{ github.repository }}-docs:latest

      - name: Run documentation build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            -e QUARTO_PYTHON=python3 \
            ghcr.io/${{ github.repository }}-docs:latest \
            python docs/build.py --website

      - name: Prepare Pages artifact
        run: |
          mkdir -p docs/_pages
          rsync -av docs/_site/ docs/_pages/ \
            --exclude='*.llms.md' \
            --exclude='llms.txt'

      - name: Upload Pages artifact
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_pages
        
      - name: Prepare agent artifact with full docs path
        run: |
          mkdir -p _agent/docs
          cp -r docs/_llms _agent/docs/

      - name: Upload agent artifact
        if: ${{ github.actor != 'nektos/act' }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-agent
          path: _agent
          retention-days: 7

      - name: Trigger Nexus Build
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SSCCS_NEXUS_ACTIONS_READWRITE_PAT }}
          repository: ssccsorg/ssccs-nexus
          event-type: ssccs-docs-agent-af

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5