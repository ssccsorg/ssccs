name: Deploy Docs Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**/*.py"
      - "docs/**/*.qmd"
      - "docs/**/*.md"
      - "docs/**/*.yml"
      - "docs/**/*.txt"
      - "docs/**/*.svg"
      - "docs/**/*.bib"
      - "docs/**/*.csl"
      - "docs/**/*.c2pa_manifest.json"
      - "poc/baremetal_riscv/sv/**"
      - ".github/workflows/deploy-docs-ghpage.yml"
      - "!docs/**/README.md"
      - "!docs/**/*_.qmd"
  workflow_dispatch:
  repository_dispatch:
    types: [publish-sdb-image-complete]
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**/*.py"
      - "docs/**/*.qmd"
      - "docs/**/*.md"
      - "docs/**/*.yml"
      - "docs/**/*.txt"
      - "docs/**/*.svg"
      - "docs/**/*.bib"
      - "docs/**/*.csl"
      - "docs/**/*.c2pa_manifest.json"
      - "poc/baremetal_riscv/sv/**"
      - ".github/workflows/deploy-docs-ghpage.yml"
      - "!docs/**/README.md"
      - "!docs/**/*_.qmd"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ssccsorg/sdbs

permissions:
  contents: read
  packages: read

concurrency:
  group: "docs-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update docs release hash
        run: python3 docs/gen_release_hash.py

      - name: Compute cache key
        id: cache-key
        run: |
          cd ${{ github.workspace }}
          { find docs -type f \( -name "*.qmd" -o -name "*.md" -o -name "*.py" -o -name "*.txt" -o -name "*.yml" -o -name "*.svg" -o -name "*.bib" -o -name "*.csl" -o -name "*.c2pa_manifest.json" \) -not -path "*/.sdbtmp_*/*" -not -path "*/_sdbtmp_*/*" -not -path "*/_site/*" | sort | xargs sha256sum; sha256sum poc/baremetal_riscv/sv/_xif_constants.svh; } | sha256sum | cut -d' ' -f1 > /tmp/cache_key.txt
          echo "key=$(cat /tmp/cache_key.txt)" >> $GITHUB_OUTPUT

      - name: Cache the build cache
        uses: actions/cache@v5
        with:
          path: .sdbtmp_cache
          key: ${{ runner.os }}-sdbtmp-cache-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-sdbtmp-cache-

      - name: Cache the Jupyter cache
        uses: actions/cache@v5
        with:
          path: .sdbtmp_jupyter
          key: ${{ runner.os }}-sdbtmp-jupyter-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-sdbtmp-jupyter-

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        shell: bash

      # The documentation targets are configured to sign, so the build needs a
      # credential. A push to main signs with the deployment credential; any
      # other ref, which has no access to it, signs with an identity generated
      # inside the image so a pull request still builds.
      - name: Prepare the signing identity
        env:
          C2PA_KEY_PEM: ${{ secrets.C2PA_KEY }}
          C2PA_CERT_PEM: ${{ secrets.C2PA_CERT }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/c2pa"
          if [ -n "$C2PA_KEY_PEM" ] && [ -n "$C2PA_CERT_PEM" ]; then
            printf '%s\n' "$C2PA_KEY_PEM" > "$RUNNER_TEMP/c2pa/key.pem"
            printf '%s\n' "$C2PA_CERT_PEM" > "$RUNNER_TEMP/c2pa/chain.pem"
            chmod 600 "$RUNNER_TEMP/c2pa/key.pem" "$RUNNER_TEMP/c2pa/chain.pem"
            echo "[INFO] Signing with the deployment credential"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "::error::C2PA_KEY and C2PA_CERT must hold the deployment signing credential. The documentation targets are configured to sign."
            exit 1
          elif docker run --rm \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              sh -c 'test -x /usr/local/lib/sdbs/c2pa-make-identity'; then
            docker run --rm \
              -v "$RUNNER_TEMP/c2pa":/c2pa \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              sh -c '/usr/local/lib/sdbs/c2pa-make-identity /c2pa'
            echo "[INFO] This ref has no deployment credential; signing with a throwaway identity"
          else
            echo "::warning::The image does not carry the identity script yet, so this run signs with the flow the image has. A push to main still requires the deployment credential."
          fi

      - name: Run documentation build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -v "$RUNNER_TEMP/c2pa":/c2pa:ro \
            -w /work \
            -e QUARTO_PYTHON=python3 \
            -e C2PA_SIGNER_PATH=/usr/local/lib/sdbs/c2pa-signer \
            -e C2PA_KEY=/c2pa/key.pem \
            -e C2PA_CERT=/c2pa/chain.pem \
            -e C2PA_TSA_URL=http://timestamp.digicert.com \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            sdb build docs --website

      - name: Deploy pages artifacts
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy docs/_site --project-name=ssccs-docs

      - name: Prepare agent artifact
        run: |
          mkdir -p _agent/docs
          cp -r docs/_llms _agent/docs/

      - name: Upload agent artifacts to R2-S3
        if: ${{ github.ref == 'refs/heads/main' && github.actor != 'nektos/act' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CFR2_USR_API_S3_ACCID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CFR2_USR_API_S3_SECKEY }}
        run: |
          # R2 accepts only `auto` or a jurisdiction code, never an AWS region name.
          aws s3 sync _agent/docs s3://ssccs-nexus-af/ssccs/docs \
            --endpoint-url ${{ secrets.CFR2_USR_API_HOST }} \
            --region auto \
            --delete
        shell: bash

      - name: Trigger Nexus Build
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SSCCS_NEXUS_ACTIONS_READWRITE_PAT }}
          repository: ssccsorg/nexus
          event-type: ssccs-docs-agent-af
