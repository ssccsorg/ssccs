name: Devcontainer Rigorous Check

on:
  push:
    branches: [develop, main]
    paths:
      - '.devcontainer/devcontainer.json'
      - '.devcontainer/Dockerfile'
      - '.devcontainer/setup_docs.sh'
      - '.github/workflows/verify-devcontainer.yml'
  pull_request:
    paths:
      - '.devcontainer/devcontainer.json'
      - '.devcontainer/Dockerfile'
      - '.devcontainer/setup_docs.sh'
      - '.github/workflows/verify-devcontainer.yml'
  workflow_dispatch:
    inputs:
      test_scope:
        required: true
        default: 'all'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Run Validation
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            chmod +x .devcontainer/setup_docs.sh
            ./.devcontainer/setup_docs.sh
            echo "Environment Validation Complete"