# Workflow for building Quarto site with Python and deploying to GitHub Pages
name: Build and Deploy Quarto site

on:
  push:
    branches: ["main", "quarto-ghpage-test"]
    paths:
      - 'docs/**/*.py'
      - 'docs/**/*.qmd'
      - 'docs/**/*.txt'
      - 'docs/**/*.yml'
      - 'docs/**/*.txt'
      - 'docs/**/*.svg'
      - 'docs/**/*.bib'
      - 'docs/**/*.csl'
      - '.github/workflows/quarto-ghpage.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      QUARTO_VER: "1.9.35"
      C2PA_VER: "0.9.12"
      REQUIREMENTS_TXT: 'docs/requirements.txt'
      TEX_PACKAGES_TXT: 'docs/tex-packages.txt'

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.REQUIREMENTS_TXT }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y graphviz librsvg2-bin

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.REQUIREMENTS_TXT }}

      - name: Cache Quarto
        id: cache-quarto
        uses: actions/cache@v4
        with:
          path: /opt/quarto
          key: ${{ runner.os }}-quarto-${{ env.QUARTO_VER }}

      - name: Install Quarto (if cache miss)
        if: steps.cache-quarto.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/quarto-dev/quarto-cli/releases/download/v${{ env.QUARTO_VER }}/quarto-${{ env.QUARTO_VER }}-linux-amd64.tar.gz"
          sudo mkdir -p /opt/quarto
          sudo tar -xzf "quarto-${{ env.QUARTO_VER }}-linux-amd64.tar.gz" -C /opt/quarto --strip-components=1
          rm "quarto-${{ env.QUARTO_VER }}-linux-amd64.tar.gz"

      - name: Add Quarto to PATH
        run: echo "/opt/quarto/bin" >> $GITHUB_PATH

      - name: Cache TinyTeX
        id: cache-tinytex
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: ${{ runner.os }}-tinytex-${{ hashFiles(env.TEX_PACKAGES_TXT) }}

      - name: Install TinyTeX (if cache miss)
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          $HOME/.TinyTeX/bin/x86_64-linux/tlmgr install $(grep -v '^#' ${{ env.TEX_PACKAGES_TXT }} | xargs)

      - name: Add TinyTeX to PATH
        run: echo "$HOME/.TinyTeX/bin/x86_64-linux" >> $GITHUB_PATH

      - name: Cache c2patool
        id: cache-c2patool
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/c2patool
          key: ${{ runner.os }}-c2patool-${{ env.C2PA_VER }}

      - name: Install c2patool (if cache miss)
        if: steps.cache-c2patool.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -L "https://github.com/contentauth/c2patool/releases/download/v${{ env.C2PA_VER }}/c2patool-v${{ env.C2PA_VER }}-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/c2patool.tar.gz
          tar -xzf /tmp/c2patool.tar.gz -C /tmp
          mv /tmp/c2patool/c2patool ~/.local/bin/
          chmod +x ~/.local/bin/c2patool

      - name: Add c2patool to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run build script
        working-directory: docs
        env:
          QUARTO_PYTHON: python3
        run: python build.py --single-command

      # Prepare site for Pages deployment
      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -avm \
            --exclude='.quarto/' \
            --exclude='*_files/' \
            --exclude='*_output/' \
            --exclude='*_extensions/' \
            --include='*/' \
            --include='*.html' \
            --include='*.pdf' \
            --include='*.png' \
            --include='*.jpg' \
            --include='*.css' \
            --include='*.js' \
            --include='*.c2pa' \
            --exclude='*' \
            docs/ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      # Prepare filtered source files for sync (only .md, excludes legal/, whitepaper/, README.md)
      - name: Prepare www-docs artifact
        run: |
          mkdir -p www-docs
          rsync -avm --delete \
            --include='/README.md' \
            --exclude='.quarto/' \
            --exclude='*_files/' \
            --exclude='*_output/' \
            --exclude='*_extensions/' \
            --exclude='legal/*' \
            --exclude='whitepaper/*' \
            --exclude="**/README.md" \
            --include='*/' \
            --include='*.md' \
            --exclude='*' \
            docs/ www-docs/

      - name: Upload sync artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-for-sync
          path: ./www-docs
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-www-docs:
    runs-on: ubuntu-latest
    needs: build
    env:
      TARGET_BRANCH: main
    steps:
      - name: Download sync artifact
        uses: actions/download-artifact@v4
        with:
          name: source-for-sync
          path: ./source

      - name: Checkout target repository (ssccs-www)
        uses: actions/checkout@v6
        with:
          repository: ssccsorg/ssccs-www
          token: ${{ secrets.WWW_WRITE }}
          # Absolute path outside the current workspace to avoid scope errors
          path: ${{ github.workspace }}/cloned-ssccs-www
          ref: main
          fetch-depth: 0

      # Source is already filtered; just mirror it to target docs/
      - name: Sync docs to target repository
        run: rsync -avm --delete source/ ${{ github.workspace }}/cloned-ssccs-www/docs/

      - name: Commit and push changes
        working-directory: ${{ github.workspace }}/cloned-ssccs-www
        run: |
          git config user.name "SSCCS Admin"
          git config user.email "admin@ssccs.org"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync docs from ssccsorg/ssccs/docs@${{ github.sha }}"
            git push origin ${{ env.TARGET_BRANCH }}
          fi