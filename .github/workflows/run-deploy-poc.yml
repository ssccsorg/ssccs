name: SSCCS POC CI

on:
  push:
    # A pull request runs this workflow too. Restricting push to main keeps one push from paying for the job twice,
    # which is what the same commit did while both triggers were open to branches.
    branches:
      - main
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/**/*.S'
      - 'poc/rust-toolchain*'
      - '.github/workflows/run-deploy-poc.yml'
      - '.github/workflows/publish-poc-image.yml'
      - 'poc/run.sh'
      - 'poc/doc.py'
      - 'poc/Dockerfile'
      - '.dockerignore'
      - 'poc/baremetal_riscv/simulation/**'
  pull_request:
    branches:
      - main
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/**/*.S'
      - 'poc/rust-toolchain*'
      - '.github/workflows/run-deploy-poc.yml'
      - 'poc/run.sh'
      - 'poc/doc.py'
      - 'poc/Dockerfile'
      - '.dockerignore'
      - 'poc/baremetal_riscv/simulation/**'
  workflow_dispatch:
  repository_dispatch:
    types: [publish-poc-image-complete]

concurrency:
  group: "poc"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-poc

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image
        run: |
          echo "tag=${REGISTRY}/${IMAGE_NAME}:poc-$(sha256sum poc/Dockerfile | cut -c1-8)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The image is content-addressed, so a pull either gives the toolchain this Dockerfile describes or nothing.
      # Falling back to `latest` would label a stale toolchain with the new content's name. When the content has not
      # been published yet, the build reuses the layers the publish workflow pushed into the same cache scope, so a
      # changed Dockerfile costs the changed layers rather than a Spike build from source.
      - name: Pull or build Docker image
        run: |
          image="${{ steps.image.outputs.tag }}"
          if docker pull "$image"; then
            echo "Pulled $image"
          else
            echo "Not published yet. Building $image from the shared layer cache."
            docker buildx build --load \
              -t "$image" \
              -f poc/Dockerfile \
              --cache-from type=gha,scope=shared-poc \
              --cache-to type=gha,mode=min,scope=shared-poc \
              --provenance=false --sbom=false \
              .
          fi
        shell: bash

      - name: Run full validation inside container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ${{ steps.image.outputs.tag }} \
            bash -c "cd /workspace/poc && bash run.sh --validation"
        shell: bash

      - name: Generate documentation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ${{ steps.image.outputs.tag }} \
            bash -c "cd /workspace/poc && python3 doc.py"
        shell: bash

      - name: Prepare artifacts
        run: |
          mkdir -p _agent
          rsync -avm --delete --delete-excluded \
            --include='_llms/***' \
            --include='README.md' \
            --exclude='*' \
            poc/ _agent/poc/

      - name: Upload artifacts to R2-S3
        if: ${{ github.actor != 'nektos/act' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CFR2_USR_API_S3_ACCID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CFR2_USR_API_S3_SECKEY }}
        run: |
          # R2 accepts only `auto` or a jurisdiction code, never an AWS region name.
          aws s3 sync _agent/poc s3://ssccs-nexus-af/ssccs/poc/ \
            --endpoint-url ${{ secrets.CFR2_USR_API_HOST }} \
            --region auto \
            --delete

      - name: Trigger Nexus Build
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SSCCS_NEXUS_ACTIONS_READWRITE_PAT }}
          repository: ssccsorg/nexus
          event-type: ssccs-poc-agent-af
