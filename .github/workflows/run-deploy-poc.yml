name: Rust POC CI

on:
  push:
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/**/*.S'
      - 'poc/rust-toolchain*'
      - '.github/workflows/run-deploy-poc.yml'
      - 'poc/run.sh'
      - 'poc/doc.py'
  pull_request:
    branches:
      - main
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/**/*.S'
      - 'poc/rust-toolchain*'
      - '.github/workflows/run-deploy-poc.yml'
      - 'poc/run.sh'
      - 'poc/doc.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "poc"

      - name: Run Script (lint/build/test/doc)
        working-directory: ./poc
        run: |
          chmod +x run.sh
          ./run.sh --validation
          python3 doc.py
        shell: bash


      - name: Prepare poc agent artifacts
        run: |
          mkdir -p _agent
          rsync -avm --delete --delete-excluded \
            --include='_llms/***' \
            --include='README.md' \
            --exclude='*' \
            poc/ _agent/poc/

      - name: Upload agent artifects to R2-S3
        if: ${{ github.actor != 'nektos/act' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CFR2_USR_API_S3_ACCID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CFR2_USR_API_S3_SECKEY }}
        run: |
          aws s3 sync _agent/poc s3://ssccs-nexus-af/ssccs/poc/ \
            --endpoint-url ${{ secrets.CFR2_USR_API_HOST }} \
            --delete

      - name: Trigger Nexus Build
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SSCCS_NEXUS_ACTIONS_READWRITE_PAT }}
          repository: ssccsorg/ssccs-nexus
          event-type: ssccs-poc-agent-af

  spike-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            device-tree-compiler \
            gcc-riscv64-unknown-elf \
            binutils-riscv64-unknown-elf

      - name: Build spike (RISC-V ISA simulator)
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim.git
          cd riscv-isa-sim
          mkdir build && cd build
          ../configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          cd ../..

      - name: Build riscv-pk (proxy kernel)
        run: |
          git clone https://github.com/riscv-software-src/riscv-pk.git
          cd riscv-pk
          mkdir build && cd build
          ../configure --prefix=/usr/local --host=riscv64-unknown-elf
          make -j$(nproc)
          sudo make install
          # riscv-pk installs to /usr/local/riscv64-unknown-elf/bin/pk
          echo "/usr/local/riscv64-unknown-elf/bin" >> $GITHUB_PATH
          cd ../..

      - name: Verify tools
        run: |
          spike --version
          riscv64-unknown-elf-gcc --version
          which pk

      - name: Build and run spike tests
        working-directory: ./poc/baremetal_riscv/simulation
        run: |
          make check
        shell: bash
