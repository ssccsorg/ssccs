name: SSCCS POC CI

on:
  push:
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/**/*.S'
      - 'poc/rust-toolchain*'
      - '.github/workflows/run-deploy-poc.yml'
      - 'poc/run.sh'
      - 'poc/doc.py'
      - 'poc/Dockerfile'
      - 'poc/baremetal_riscv/simulation/**'
  pull_request:
    branches:
      - main
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/**/*.S'
      - 'poc/rust-toolchain*'
      - '.github/workflows/run-deploy-poc.yml'
      - 'poc/run.sh'
      - 'poc/doc.py'
      - 'poc/Dockerfile'
      - 'poc/baremetal_riscv/simulation/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            device-tree-compiler \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            git \
            python3
          # Alias so riscv-pk configure finds the cross-compiler
          sudo ln -sf /usr/bin/riscv64-linux-gnu-gcc    /usr/local/bin/riscv64-unknown-elf-gcc
          sudo ln -sf /usr/bin/riscv64-linux-gnu-g++    /usr/local/bin/riscv64-unknown-elf-g++
          sudo ln -sf /usr/bin/riscv64-linux-gnu-ar     /usr/local/bin/riscv64-unknown-elf-ar
          sudo ln -sf /usr/bin/riscv64-linux-gnu-as     /usr/local/bin/riscv64-unknown-elf-as
          sudo ln -sf /usr/bin/riscv64-linux-gnu-ld     /usr/local/bin/riscv64-unknown-elf-ld
          sudo ln -sf /usr/bin/riscv64-linux-gnu-objdump /usr/local/bin/riscv64-unknown-elf-objdump
          sudo ln -sf /usr/bin/riscv64-linux-gnu-objcopy /usr/local/bin/riscv64-unknown-elf-objcopy

      - name: Build spike (RISC-V ISA simulator)
        run: |
          git clone https://github.com/riscv-software-src/riscv-isa-sim.git /tmp/spike
          cd /tmp/spike && mkdir build && cd build
          ../configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          rm -rf /tmp/spike

      - name: Build riscv-pk (proxy kernel)
        run: |
          git clone https://github.com/riscv-software-src/riscv-pk.git /tmp/pk
          cd /tmp/pk && mkdir build && cd build
          CC=riscv64-unknown-elf-gcc ../configure --prefix=/usr/local --host=riscv64-unknown-elf
          make -j$(nproc)
          sudo make install
          rm -rf /tmp/pk
          echo "PK=/usr/local/riscv64-unknown-elf/bin/pk" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "poc"

      - name: Full validation (Rust + Spike)
        working-directory: ./poc
        run: ./run.sh --validation
        shell: bash

      - name: Generate documentation
        working-directory: ./poc
        run: python3 doc.py
        shell: bash

      - name: Prepare artifacts
        run: |
          mkdir -p _agent
          rsync -avm --delete --delete-excluded \
            --include='_llms/***' \
            --include='README.md' \
            --exclude='*' \
            poc/ _agent/poc/

      - name: Upload artifacts to R2
        if: ${{ github.actor != 'nektos/act' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CFR2_USR_API_S3_ACCID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CFR2_USR_API_S3_SECKEY }}
        run: |
          aws s3 sync _agent/poc s3://ssccs-nexus-af/ssccs/poc/ \
            --endpoint-url ${{ secrets.CFR2_USR_API_HOST }} \
            --delete

      - name: Trigger Nexus build
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SSCCS_NEXUS_ACTIONS_READWRITE_PAT }}
          repository: ssccsorg/ssccs-nexus
          event-type: ssccs-poc-agent-af
