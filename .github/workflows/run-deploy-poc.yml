name: SSCCS POC CI

on:
  push:
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/**/*.S'
      - 'poc/rust-toolchain*'
      - '.github/workflows/run-deploy-poc.yml'
      - '.github/workflows/publish-poc-image.yml'
      - 'poc/run.sh'
      - 'poc/doc.py'
      - 'poc/Dockerfile'
      - 'poc/baremetal_riscv/simulation/**'
  pull_request:
    branches:
      - main
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/**/*.S'
      - 'poc/rust-toolchain*'
      - '.github/workflows/run-deploy-poc.yml'
      - 'poc/run.sh'
      - 'poc/doc.py'
      - 'poc/Dockerfile'
      - 'poc/baremetal_riscv/simulation/**'
  workflow_dispatch:
  repository_dispatch:
    types: [publish-poc-image-complete]

concurrency:
  group: "poc"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-poc

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built Docker image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Run full validation inside container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c "cd /workspace/poc && bash run.sh --validation"
        shell: bash

      - name: Generate documentation
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c "cd /workspace/poc && python3 doc.py"
        shell: bash

      - name: Prepare artifacts
        run: |
          mkdir -p _agent
          rsync -avm --delete --delete-excluded \
            --include='_llms/***' \
            --include='README.md' \
            --exclude='*' \
            poc/ _agent/poc/

      - name: Upload artifacts to R2-S3
        if: ${{ github.actor != 'nektos/act' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CFR2_USR_API_S3_ACCID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CFR2_USR_API_S3_SECKEY }}
        run: |
          aws s3 sync _agent/poc s3://ssccs-nexus-af/ssccs/poc/ \
            --endpoint-url ${{ secrets.CFR2_USR_API_HOST }} \
            --delete

      - name: Trigger Nexus Build
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SSCCS_NEXUS_ACTIONS_READWRITE_PAT }}
          repository: ssccsorg/ssccs-nexus
          event-type: ssccs-poc-agent-af
