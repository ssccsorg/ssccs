name: SSCCS POC CI

on:
  push:
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/**/*.S'
      - 'poc/rust-toolchain*'
      - '.github/workflows/run-deploy-poc.yml'
      - 'poc/run.sh'
      - 'poc/doc.py'
      - 'poc/Dockerfile'
      - 'poc/baremetal_riscv/simulation/**'
  pull_request:
    branches:
      - main
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/**/*.S'
      - 'poc/rust-toolchain*'
      - '.github/workflows/run-deploy-poc.yml'
      - 'poc/run.sh'
      - 'poc/doc.py'
      - 'poc/Dockerfile'
      - 'poc/baremetal_riscv/simulation/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_IMAGE: ghcr.io/ssccsorg/ssccs-poc-ci

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and cache Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: poc/Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }},${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:latest
          cache-to: type=inline

      - name: Run full validation inside container
        run: |
          docker run --rm \
            -v "$(pwd):/workspace" \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            bash -c "cd /workspace/poc && bash run.sh --validation"
        shell: bash

      - name: Generate documentation inside container
        run: |
          docker run --rm \
            -v "$(pwd):/workspace" \
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            bash -c "cd /workspace/poc && python3 doc.py"
        shell: bash

      - name: Prepare artifacts
        run: |
          mkdir -p _agent
          rsync -avm --delete --delete-excluded \
            --include='_llms/***' \
            --include='README.md' \
            --exclude='*' \
            poc/ _agent/poc/

      - name: Upload artifacts to R2
        if: ${{ github.actor != 'nektos/act' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CFR2_USR_API_S3_ACCID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CFR2_USR_API_S3_SECKEY }}
        run: |
          aws s3 sync _agent/poc s3://ssccs-nexus-af/ssccs/poc/ \
            --endpoint-url ${{ secrets.CFR2_USR_API_HOST }} \
            --delete

      - name: Trigger Nexus build
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SSCCS_NEXUS_ACTIONS_READWRITE_PAT }}
          repository: ssccsorg/ssccs-nexus
          event-type: ssccs-poc-agent-af
