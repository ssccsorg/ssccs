name: Rust POC CI

on:
  push:
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/rust-toolchain*'
      - '.github/workflows/check-poc.yml'
      - 'poc/run.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/rust-toolchain*'
      - '.github/workflows/check-poc.yml'
      - 'poc/run.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-poc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "poc"

      - name: Run Unified Validation Script
        working-directory: ./poc
        run: |
          chmod +x run.sh
          ./run.sh --validation
        shell: bash

      - name: Prepare poc agent artifacts
        run: |
          mkdir -p _agent
          rsync -av --delete \
            --exclude='target' \
            --exclude='.git' \
            --exclude='*.swp' \
            --exclude='*.rs.bk' \
            poc/ _agent/poc/

      - name: Upload poc agent artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poc-agent
          path: _agent
          retention-days: 7