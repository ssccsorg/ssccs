name: Rust POC CI

on:
  push:
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/run.sh'
      - '.github/workflows/rust-poc-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'poc/Cargo.*'
      - 'poc/**/*.rs'
      - 'poc/run.sh'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "poc"

      - name: Run Unified Validation Script
        working-directory: ./poc
        run: |
          chmod +x run.sh
          ./run.sh
        shell: bash