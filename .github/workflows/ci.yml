name: CI/CD

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "poc/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
      - "!docs/**/README.md"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "poc/**"
      - "Dockerfile"
      - ".github/workflows/ci.yml"
      - "!docs/**/README.md"
  workflow_dispatch:
  repository_dispatch:
    types: [publish-sdb-image-complete]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/ssccsorg/ssccs
  AWS_ACCESS_KEY_ID: ${{ secrets.CFR2_USR_API_S3_ACCID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CFR2_USR_API_S3_SECKEY }}
  AWS_ENDPOINT_URL: ${{ secrets.CFR2_USR_API_HOST }}

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        run: docker pull ghcr.io/ssccsorg/sdbs:latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: Dockerfile
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          push: true
          pull: true
          cache-from: type=gha,scope=ssccs
          cache-to: type=gha,mode=min,scope=ssccs
          provenance: false
          sbom: false

      # Poc change detection
      - name: Check POC changes
        id: poc-check
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch|repository_dispatch)
              echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            pull_request) BASE="origin/${{ github.base_ref }}" ;;
            push)
              BASE="${{ github.event.before }}"
              [ "$BASE" = "0000000000000000000000000000000000000000" ] && BASE="HEAD~1" ;;
          esac
          if git diff --name-only "$BASE"...HEAD -- poc/ Dockerfile .github/workflows/ci.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Poc validation
      - name: Run full validation
        if: steps.poc-check.outputs.changed == 'true'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.IMAGE }}:latest \
            bash -c "cd /workspace/poc && bash run.sh --validation"

      - name: Generate POC documentation
        if: steps.poc-check.outputs.changed == 'true'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ env.IMAGE }}:latest \
            bash -c "cd /workspace/poc && python3 doc.py"

      - name: Prepare POC artifacts
        if: steps.poc-check.outputs.changed == 'true'
        run: |
          mkdir -p _agent
          rsync -avm --delete --delete-excluded \
            --include='_llms/***' \
            --include='README.md' \
            --exclude='*' \
            poc/ _agent/poc/

      - name: Upload artifacts to R2-S3
        if: steps.poc-check.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync _agent/poc s3://ssccs-nexus-af/ssccs/poc/ \
            --endpoint-url ${{ env.AWS_ENDPOINT_URL }} \
            --delete

      - name: Trigger Nexus Build
        if: steps.poc-check.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SSCCS_NEXUS_ACTIONS_READWRITE_PAT }}
          repository: ssccsorg/nexus
          event-type: ssccs-poc-agent-af

      # Docs change detection
      - name: Check docs changes
        id: docs-check
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch|repository_dispatch)
              echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            pull_request) BASE="origin/${{ github.base_ref }}" ;;
            push)
              BASE="${{ github.event.before }}"
              [ "$BASE" = "0000000000000000000000000000000000000000" ] && BASE="HEAD~1" ;;
          esac
          if git diff --name-only "$BASE"...HEAD -- docs/ Dockerfile .github/workflows/ci.yml | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Docs build
      - name: Compute cache key
        if: steps.docs-check.outputs.changed == 'true'
        id: cache-key
        run: |
          cd ${{ github.workspace }}
          find docs -type f \( -name "*.qmd" -o -name "*.md" -o -name "*.py" -o -name "*.txt" -o -name "*.yml" -o -name "*.svg" -o -name "*.bib" -o -name "*.csl" -o -name "*.c2pa_manifest.json" \) -not -path "*/_cached/*" -not -path "*/_site/*" | sort | xargs sha256sum | sha256sum | cut -d' ' -f1 > /tmp/cache_key.txt
          echo "key=$(cat /tmp/cache_key.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache _cached directory
        uses: actions/cache@v5
        with:
          path: _cached
          key: ${{ runner.os }}-cached-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-cached-

      - name: Cache _jupyter_cache directory
        if: steps.docs-check.outputs.changed == 'true'
        uses: actions/cache@v5
        with:
          path: _jupyter_cache
          key: ${{ runner.os }}-jupyter-${{ steps.cache-key.outputs.key }}
          restore-keys: |
            ${{ runner.os }}-jupyter-

      - name: Generate SV gate-level diagrams
        if: steps.docs-check.outputs.changed == 'true'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/docs \
            ${{ env.IMAGE }}:latest \
            python3 poc/sv2dot.py ../poc/baremetal_riscv/sv

      - name: Run documentation build
        if: steps.docs-check.outputs.changed == 'true'
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e QUARTO_PYTHON=python3 \
            ${{ env.IMAGE }}:latest \
            sdb build docs --website

      - name: Prepare Pages artifact
        if: steps.docs-check.outputs.changed == 'true'
        run: |
          mkdir -p docs/_pages
          cp -r docs/_site/. docs/_pages/

      - name: Upload Pages artifact
        if: steps.docs-check.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_pages

      - name: Deploy to GitHub Pages
        if: steps.docs-check.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Prepare agent artifact
        if: steps.docs-check.outputs.changed == 'true'
        run: |
          mkdir -p _agent/docs
          cp -r docs/_llms _agent/docs/

      - name: Upload agent artifacts to R2-S3
        if: steps.docs-check.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync _agent/docs s3://ssccs-nexus-af/ssccs/docs \
            --endpoint-url ${{ env.AWS_ENDPOINT_URL }} \
            --delete

      - name: Trigger Nexus Build
        if: steps.docs-check.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.SSCCS_NEXUS_ACTIONS_READWRITE_PAT }}
          repository: ssccsorg/nexus
          event-type: ssccs-docs-agent-af
