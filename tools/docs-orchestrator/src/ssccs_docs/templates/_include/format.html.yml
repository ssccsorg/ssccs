format:
  html:
    default-figure-format: "svg"
    fig-format: "svg"
    embed-resources: false
    self-contained-math: false
    minimal: true
    theme: minimal
    toc: true
    toc-title: "Contents"
    font-size: 11pt
    page-layout: full
    code-overflow: wrap
    format-links: true
    execute:
      eval: true
      echo: false
