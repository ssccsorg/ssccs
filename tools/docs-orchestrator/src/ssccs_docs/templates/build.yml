# SDBS Default Build Configuration
# Target-specific configurations (optional)
target_config: {}

# Pre-build commands
pre_build:
  _global: []

# Post-render commands
post_render:
  _global: []

# Exclude patterns (gitignore-style)
exclude:
  - "**/README.md"
  - "**/*.llms.md"
  - "**/llms.txt"
  - "**/_include/"
  - "**/_extensions/"
  - "**/_utils/"
  - "**/*_output/"
  - "**/*_files/"
  - "**/*_cached/"
  - "**/*_libs/"
  - "**/*_pages/"
