# SDBS Build Configuration
# This file is read by SDBS at build time to discover targets,
# apply target-specific overrides, and execute pre/post hooks.
# Place this file in your docs root directory.

# Target-specific configurations (optional)
# Each key is a target name (auto-discovered from .qmd/.md files).
# Settings here override the defaults for that target only.
target_config: {}

# Pre-build commands: executed before any Quarto rendering begins.
# Supports _global (always runs) and target-specific entries.
# If the executable is not found on PATH, the command is skipped.
# If a command fails, a warning is logged but the build continues.
pre_build:
  _global: []

# Post-render commands: executed after all targets have been rendered
# and merged into the final _site/ directory.
# Same format and error handling as pre_build.
post_render:
  _global: []

# Exclude patterns (gitignore-style)
# Files and directories matching these patterns are excluded from
# target discovery. They will not be built or processed.
# Supports:
#   Glob patterns:   **/*.md, **/README.md
#   Directory only:  **/_include/, **/*_libs/  (trailing slash)
#   Simple names:    README.md, contributing.md
exclude:
  # Ignore top-level README files (not part of the documentation).
  - "**/README.md"
  # LLM-friendly .llms.md files are generated by the build, not built.
  - "**/*.llms.md"
  - "**/llms.txt"

  # Directory patterns (trailing slash indicates a directory).
  - "**/_include/"
  - "**/_extensions/"
  - "**/_utils/"
  - "**/*_output/"
  - "**/*_files/"
  - "**/*_cached/"
  - "**/*_libs/"
  - "**/*_pages/"
  # Jupyter cache created during code cell execution.
  - "**/.jupyter_cache"
