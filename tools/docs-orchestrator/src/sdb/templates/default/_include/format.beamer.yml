# Beamer (presentation) output format configuration.
# Referenced from .qmd files that produce Beamer PDF slides.
# Typically included via metadata-files in the Beamer target's front matter.

format:
  beamer:
    # Do not auto-number sections in the presentation.
    number-sections: false
    # Figure format for Beamer: PDF for vector quality on projectors.
    fig-format: pdf
    # Aspect ratio of the slides: 16:10 (wide).
    aspectratio: 1610
    # Additional LaTeX class options passed to the Beamer document class.
    classoption: [12pt]
    # Font theme for Beamer. "professionalfonts" disables Beamer's
    # default font substitutions, allowing your system fonts to be used.
    fonttheme: "professionalfonts"
