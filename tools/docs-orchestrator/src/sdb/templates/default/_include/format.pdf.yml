# PDF output format configuration.
# Referenced from .qmd files that produce PDF output.
# Typically included via metadata-files or format entries in YAML front matter.

format:
  pdf:
    # Default image format for figures when rendering to PDF.
    # PDF is preferred for vector quality in print output.
    default-figure-format: "pdf"
    fig-format: pdf
    # DPI for raster figures embedded in the PDF.
    fig-dpi: 300
    # Page size for the PDF document.
    papersize: a4
    # Enable graphics processing for LaTeX output.
    graphics: true
    # Monochrome highlighting for code blocks in the PDF.
    highlight-style: monochrome
    # Default figure placement: 'H' means "here, exactly where defined."
    # Requires the LaTeX float package.
    fig-pos: 'H'
    # Position of the figure caption relative to the figure.
    fig-cap-location: bottom
