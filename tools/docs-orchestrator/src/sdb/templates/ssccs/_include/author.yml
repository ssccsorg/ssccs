# Author metadata used in document front matter.
# Referenced from index.qmd and other .qmd files via:
#   metadata-files:
#     - _include/author.yml
# Supported fields: name, email, affiliations, ORCID, etc.
# See https://quarto.org/docs/authoring/frontmatter.html

author:
  # Primary author. Set `corresponding: true` for the contact author.
  - name: Your Name
    corresponding: true
    email: your@email.org
    affiliations:
      # Organization or institution name.
      - name: Your Organization
        # Domain name used for institutional affiliation badges.
        domain: your.org
        # Website of the organization.
        url: https://your.org
