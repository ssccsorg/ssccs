# Shared Quarto configuration applied to all formats.
# Included by _quarto-website.yml for website builds and referenced
# automatically by Quarto when rendering any .qmd file in this directory.

project:
  # Script executed by Quarto before each render. Useful for dynamic
  # content generation or environment setup.
  pre-render: python3 _quarto_pre-render.py

# Path to the CSL (Citation Style Language) file used for formatting
# citations and bibliographies. IEEE style is the default.
csl: _include/ieee.csl

# When true, hyperlinks are created from citation keys in the text to
# the corresponding bibliography entry.
link-citations: true

# Execution options for code cells in .qmd files.
execute:
  # Cache the output of code cells across renders to avoid re-executing
  # expensive computations when the source code has not changed.
  cache: true
  # Do not show the source code of code cells in the rendered output.
  echo: false
