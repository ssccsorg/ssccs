[project]
name = "sdb"
version = "0.1.0"
description = "SSCCS Documentation Build System (SDBS) — a portable Quarto orchestration layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "SSCCS Foundation", email = "contact@ssccs.org" },
]
keywords = ["quarto", "documentation", "build-system", "orchestration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/ssccsorg/ssccs"
Documentation = "https://docs.ssccs.org"

[project.scripts]
sdb = "sdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sdb" = ["py.typed"]
"*" = ["*.qmd", "*.yml", "*.yaml", "*.py", "*.csl", "*.md"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
