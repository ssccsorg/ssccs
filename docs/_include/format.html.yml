format:
  html:
    default-figure-format: "svg"
    fig-format: "svg"
    embed-resources: false
    self-contained-math: false
    minimal: true
    theme: minimal
    toc: true
    toc-title: "Contents"
    toc-expand: true
    font-size: 11pt
    page-layout: full
    code-overflow: wrap
    include-in-header:
      text: |
        <style>
        a {
            text-decoration: none !important;
        }
        .figure-img {
            width: 100%;
        }
        </style>
    format-links: true
    execute:
        eval: true
        echo: false