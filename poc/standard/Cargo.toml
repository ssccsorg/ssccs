[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/primitive",
    "crates/schemes",
    "crates/examples",
    "crates/benchmarks",
    "crates/field-synthesis",
    "crates/hardware-mapping",
    # Concept crates — each implements and validates one SSCCS concept
    "crates/concepts/segment",
    "crates/concepts/field",
    "crates/concepts/projector",
    "crates/concepts/observation",
    "crates/concepts/space",
    "crates/concepts/scheme",
    "crates/concepts/adjacency",
    "crates/concepts/composite",
    "crates/concepts/transition",
    "crates/concepts/integrated",
    "crates/concepts/data-processing",
]

[workspace.dependencies]
# Common dependencies shared across workspace crates
blake3 = "1.8.3"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "2.0.18"
dyn-clone = "1"
