[package]
name = "ssccs-concepts"
version = "0.1.0"
edition = "2024"

# The constitutional concepts, one binary each. They were eleven crates for eleven short programs; the concept is
# still runnable and gated on its own, and the workspace carries one member instead of eleven.

[dependencies]
ssccs-core = { path = "../core" }
ssccs-primitive = { path = "../primitive" }
ssccs-schemes = { path = "../schemes" }
ssccs-examples = { path = "../examples" }
hex = "0.4.3"
rand = "0.8"
