[package]
name = "ssccs-benchmarks"
version = "0.1.0"
edition = "2024"
description = "Validation-only benchmarking kernels: pure Rust baseline vs SSCCS reference simulation"

[dependencies]
ssccs-core = { path = "../standard/crates/core" }
ssccs-primitive = { path = "../standard/crates/primitive" }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "bench"
path = "bench.rs"
harness = false
