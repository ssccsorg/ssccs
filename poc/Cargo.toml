[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/primitive",
    "crates/field-synthesis",
    "crates/hardware-mapping",
    "crates/compiler-opt",
]

[workspace.dependencies]
# Common dependencies shared across workspace crates
blake3 = "1.8.3"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
bincode = "1"
thiserror = "2.0.18"
dyn-clone = "1"
